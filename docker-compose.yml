# Production deployment configuration

name: pastebin

services:
  pg:
    build: ./db/postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - main
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  pg-migrate:
    image: flyway/flyway
    command: migrate
    volumes:
      - ./db/postgresql/migrations:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:postgresql://pg:${POSTGRES_PORT}/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - main

  minio:
    image: minio/minio
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - main

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    entrypoint: /bin/sh -c
    command: |
      "
      mc alias set local $$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb local/pastes &&
      mc version enable local/pastes &&
      mc anonymous set-json /etc/minio/pastes_policy.json local/pastes
      "
    volumes:
      - ./db/minio/pastes_policy.json:/etc/minio/pastes_policy.json:ro
    networks:
      - main

  read-service:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:v2.15
    restart: unless-stopped
    user: "${HOST_UID-1000}:${HOST_GID-1000}"
    environment:
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      GRPC_FRIEND_ENDPOINT: ${GRPC_FRIEND_ENDPOINT}
    volumes:
      - ./services/read-service:/app:rw
      - ./shared/keys/dev:/run/secrets:ro
    working_dir: /app
    command: bash -c "
      ./build-release/read_service --config configs/static_config.yaml"
    expose:
      - "8080" # only accessible through nginx
    depends_on:
      pg-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 2s
      timeout: 2s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  write-service:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:v2.15
    restart: unless-stopped
    user: "${HOST_UID-1000}:${HOST_GID-1000}"
    environment:
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: ${MINIO_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
    volumes:
      - ./services/write-service:/app:rw
      - ./shared/keys/dev:/run/secrets:ro
    working_dir: /app
    command: bash -c "
      ./build-release/write_service --config configs/static_config.yaml"
    expose:
      - "8080" # only accessible through nginx
    depends_on:
      pg-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 2s
      timeout: 2s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  user-service:
    image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:v2.15
    restart: unless-stopped
    user: "${HOST_UID-1000}:${HOST_GID-1000}"
    environment:
      POSTGRES_CONNECTION: ${POSTGRES_CONNECTION}
    volumes:
      - ./services/user-service:/app:rw
      - ./shared/keys/dev:/run/secrets:ro
    working_dir: /app
    command: bash -c "
      ./build-release/user_service --config configs/static_config.yaml"
    expose:
      - "8080" # only accessible through nginx
    depends_on:
      pg-migrate:
        condition: service_completed_successfully
    networks:
      - main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 2s
      timeout: 2s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  nginx:
    image: openresty/openresty:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/cache/nginx/pastes
    depends_on:
      - read-service
      - write-service
      - user-service
    networks:
      - main
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  main:
    driver: bridge